# Private transport for the backend collector. No TCP listener or public route.
lua_shared_dict npmplus_telemetry 2m;
map $host $npmplus_proxy_host_id { default 0; }
server {
    listen unix:/run/npmplus-telemetry.sock;
    server_name localhost;
    access_log off;
    location = / {
        content_by_lua_block { require("npmplus_telemetry").render() }
    }
}
