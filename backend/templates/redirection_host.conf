# ----------------------------------------------------------------------
# {{ domain_names | join: ", " }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# ----------------------------------------------------------------------

  server {
    {% include "_common.conf" %}

    location / { return {{ forward_http_code }} {% if forward_scheme == "auto" %}$scheme{% else %}{{ forward_scheme }}{% endif %}://{{ forward_domain_name }}{% if preserve_path == true %}$request_uri{% endif %}; }

    {{ advanced_config }}

    # Custom
    include /data/custom_nginx/server_http.conf;
    include /data/custom_nginx/server_redirect.conf;
  }
