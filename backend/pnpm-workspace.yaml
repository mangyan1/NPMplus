minimumReleaseAge: 10080
# Keep vulnerable transitive releases out of the runtime image.
overrides:
  'undici@>=8.0.0 <8.12.2': 8.12.3 # CVE-2026-109869; also cover transitive HTTP clients
  'proxy-addr@<2.0.8': 2.0.8 # CVE-2026-90711
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12 # CVE-2026-102276, CVE-2026-102277, CVE-2026-102278
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9 # CVE-2026-110095, CVE-2026-110180, CVE-2026-110306, CVE-2026-110725
  'ip-address@<10.7.4': 10.7.4 # CVE-2026-111997
# Exact versions already present in the reviewed lockfile when quarantine was enabled.
minimumReleaseAgeExclude:
  - '@noble/hashes@2.4.0'
  - '@scure/base@2.4.0'
  - express-rate-limit@8.7.0
  - qs@6.16.0
minimumReleaseAgeExcludePrune: true
allowBuilds:
  '@scarf/scarf': false
  better-sqlite3: false
