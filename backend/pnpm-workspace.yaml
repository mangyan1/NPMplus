minimumReleaseAge: 10080
# Keep vulnerable transitive releases out of the runtime image.
overrides:
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12 # CVE-2026-102276, CVE-2026-102277, CVE-2026-102278
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8 # CVE-2026-84292, CVE-2026-84394, CVE-2026-86472
  'ip-address@<=10.7.0': 10.7.2 # CVE-2026-101911 and CVE-2026-101912
# Exact versions already present in the reviewed lockfile when quarantine was enabled.
minimumReleaseAgeExclude:
  - '@noble/hashes@2.4.0'
  - '@scure/base@2.4.0'
  - express-rate-limit@8.7.0
  - qs@6.16.0
minimumReleaseAgeExcludePrune: true
allowBuilds:
  '@scarf/scarf': false
  better-sqlite3: false
