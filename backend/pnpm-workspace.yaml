minimumReleaseAge: 10080
# Keep vulnerable transitive releases out of the runtime image.
overrides:
  'brace-expansion@>=5.0.0 <5.0.11': 5.0.11 # CVE-2026-102276 and CVE-2026-102278
  'fast-uri@>=3.0.0 <3.1.7': 3.1.7 # CVE-2026-84292 and CVE-2026-84394
# Exact versions already present in the reviewed lockfile when quarantine was enabled.
minimumReleaseAgeExclude:
  - '@noble/hashes@2.4.0'
  - '@scure/base@2.4.0'
  - express-rate-limit@8.7.0
  - ip-address@10.7.0
  - qs@6.16.0
minimumReleaseAgeExcludePrune: true
allowBuilds:
  '@scarf/scarf': false
  better-sqlite3: false
