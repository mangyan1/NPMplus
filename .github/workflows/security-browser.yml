name: security-browser
on:
  push:
    branches: [develop]
    paths: ["backend/**", "frontend/**", "rootfs/**", "Dockerfile", ".github/workflows/security-browser.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "rootfs/**", "Dockerfile", ".github/workflows/security-browser.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - name: Install locked browser tooling
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build the exact checkout
        run: docker build -t npmplus:security-ci .
      - name: Exercise security APIs and browser forms
        run: node backend/.smoke/docker-security.mjs
      - name: Retain synthetic non-secret screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-browser-screenshots
          path: backend/.smoke/security-*.png
          if-no-files-found: ignore
          retention-days: 7
