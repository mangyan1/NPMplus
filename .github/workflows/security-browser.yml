name: security-browser
on:
  push:
    branches: [develop]
    paths: ["backend/**", "frontend/**", "rootfs/**", "Dockerfile", ".github/workflows/security-browser.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "rootfs/**", "Dockerfile", ".github/workflows/security-browser.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.22.0
      - name: Install locked browser tooling
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
      - name: Build the exact checkout
        run: docker build -t npmplus:security-ci .
      - name: Exercise security APIs and browser forms
        env:
          # Use the runner preinstalled Chrome instead of the Playwright CDN,
          # whose browser downloads have stalled on hosted runners.
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: node backend/.smoke/docker-security.mjs
      - name: Retain synthetic non-secret screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: security-browser-screenshots
          path: |
            backend/.smoke/security-*.png
            backend/.smoke/ui-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
