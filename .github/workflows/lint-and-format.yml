name: lint-and-format
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  lint-and-format:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.22.0
      - name: backend
        run: |
          # Tests own temporary databases and filesystem trees; no root paths.
          cd backend
          pnpm install --frozen-lockfile
          pnpm biome ci --reporter=default --reporter=github
          node validate-schema.js
          pnpm test
          python3 ../tests/installer-recovery.py
          python3 ../tests/safe-update-recovery.py
          python3 ../tests/crs-observation.py
          python3 ../tests/crs-control.py
          python3 ../tests/heal-migration.py
      - name: security invariants
        run: node tests/security-invariants.mjs
      - name: upstream sync contracts
        run: python3 tests/upstream-sync.py
      - name: dependency update contracts
        run: python3 tests/dependency-updates.py
      - name: frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm biome ci --reporter=default --reporter=github
          ./translations/sort-locale.sh
          pnpm typecheck
          pnpm test
          pnpm vite build
      - name: diff
        run: git diff --exit-code
