name: smoke-test
on:
  workflow_dispatch:
  schedule:
    # weekly, and never at a round minute
    - cron: "23 5 * * 1"

permissions: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # yes '' answers every prompt with the default, so the full interactive
      # path runs on a clean disposable vm: compose generation, ufw, crowdsec
      # with bouncer registration, anubis policy fetch, all crons installed
      - name: run setup-npmplus.sh end to end with defaults
        run: yes '' | sudo bash setup-npmplus.sh
      - name: verify the stack
        # sudo: the compose file is chmod 600 root, it holds the admin password
        run: |
          for c in npmplus npmplus-anubis crowdsec; do
            echo "--- $c logs:"; sudo docker logs --tail 40 "$c" 2>&1 || true
          done
          stopped="$(sudo docker compose -f /opt/npmplus/compose.yaml ps -a --format '{{.State}}' | grep -vx running || true)"
          if [[ -n "$stopped" ]]; then
            echo "containers not running:" >&2
            sudo docker compose -f /opt/npmplus/compose.yaml ps -a
            exit 1
          fi
          code="$(curl -ksS -o /dev/null -w '%{http_code}' -m 10 https://127.0.0.1/ || true)"
          if [[ "$code" == "000" ]]; then
            echo "no https response from npmplus (code $code)" >&2
            exit 1
          fi
          echo "smoke test ok - all containers up, https answers with $code"