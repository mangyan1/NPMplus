name: smoke-test
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches:
      - develop
    paths:
      - setup-npmplus.sh
      - crowdsec-doctor.sh
      - .github/workflows/smoke-test.yml
  pull_request:
    paths:
      - setup-npmplus.sh
      - crowdsec-doctor.sh
      - .github/workflows/smoke-test.yml

permissions: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # every prompt answered with its default: crowdsec + appsec off +
          # firewall bouncer + anubis challenge-all + cloudflare trust + ufw
          - name: defaults
          # flips every default: appsec on, firewall bouncer + challenge-all off,
          # caddy on, cloudflare trust + ufw off, explicit admin credentials
          - name: alternate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: preserve an unrelated Docker drop-in for the uninstall test
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nTimeoutStartSec=0\n' | sudo tee /etc/systemd/system/docker.service.d/99-operator-owned.conf >/dev/null
      # the answers are piped to every prompt, so the full interactive path runs
      # on a clean disposable vm: compose generation, ufw, crowdsec with bouncer
      # registration, anubis policy fetch, all crons installed
      - name: run setup-npmplus.sh end to end (${{ matrix.name }})
        env:
          TEST_ADMIN_PASSWORD: 'Smoke${NOT_SET}-Password-1'
        run: |
          if [[ "${{ matrix.name }}" == "defaults" ]]; then
            # Keep every default except UFW: enabling it severs the hosted
            # runner's control connection before the remaining checks run.
            printf '%s\n' '' '' '' '' '' '' '' '' '' n '' | sudo bash setup-npmplus.sh
          else
            printf '%s\n' UTC admin@example.com "$TEST_ADMIN_PASSWORD" y y n y n y n n y | sudo bash setup-npmplus.sh
          fi
      - name: verify the stack
        # sudo: the compose file is chmod 600 root, it holds the admin password
        run: |
          for c in $(sudo docker compose -f /opt/npmplus/compose.yaml ps -a --format '{{.Name}}'); do
            echo "--- $c logs:"; sudo docker logs --tail 40 "$c" 2>&1 || true
          done
          stopped="$(sudo docker compose -f /opt/npmplus/compose.yaml ps -a --format '{{.State}}' | grep -vx running || true)"
          if [[ -n "$stopped" ]]; then
            echo "containers not running:" >&2
            sudo docker compose -f /opt/npmplus/compose.yaml ps -a
            exit 1
          fi
          # npmplus spends its first minute on apk add php-fpm before nginx binds 443
          code="000"
          for _ in $(seq 1 40); do
            code="$(curl -ksS -o /dev/null -w '%{http_code}' -m 10 https://127.0.0.1/ || true)"
            [[ "$code" != "000" ]] && break
            sleep 5
          done
          if [[ "$code" == "000" ]]; then
            echo "no https response from npmplus (code $code)" >&2
            exit 1
          fi
          echo "smoke test ok - all containers up, https answers with $code"
          sudo docker compose -f /opt/npmplus/compose.yaml config --images | grep -q '@sha256:'
      # only the alternate variant sets INITIAL_ADMIN_EMAIL/PASSWORD; a working
      # login proves the env block was generated into the compose file correctly
      - name: admin login works (alternate)
        if: matrix.name == 'alternate'
        env:
          TEST_ADMIN_PASSWORD: 'Smoke${NOT_SET}-Password-1'
        run: |
          code="000"
          for _ in $(seq 1 40); do
            code="$(curl -ksS -o /tmp/login.json -w '%{http_code}' -m 10 -H 'Content-Type: application/json' \
              -d "{\"identity\":\"admin@example.com\",\"secret\":\"$TEST_ADMIN_PASSWORD\"}" https://127.0.0.1:81/api/tokens || true)"
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          if [[ "$code" != "200" ]]; then
            echo "admin login failed (code $code):" >&2
            cat /tmp/login.json 2>/dev/null >&2
            exit 1
          fi
          echo "admin login ok"
      - name: safe update snapshots state and passes strict health checks
        if: matrix.name == 'defaults'
        run: |
          # Reproduce the legacy VM state: an unversioned wrapper plus a setup
          # copy installed without its execute bit. The downloaded v1.6 script
          # must replace that wrapper before entering the transactional update.
          sudo sed -i '/NPMPLUS_SAFE_UPDATE_WRAPPER_VERSION=2/d' /usr/local/bin/npmplus-safe-update
          sudo chmod 0644 /opt/npmplus/setup-npmplus.sh
          sudo bash setup-npmplus.sh --update
          sudo test -x /opt/npmplus/setup-npmplus.sh
          sudo grep -qx '# NPMPLUS_SAFE_UPDATE_WRAPPER_VERSION=2' /usr/local/bin/npmplus-safe-update
      - name: uninstall preserves operator-owned Docker configuration
        if: matrix.name == 'alternate'
        run: |
          printf 'uninstall\n' | sudo /opt/npmplus/setup-npmplus.sh --uninstall
          test ! -e /opt/npmplus
          test -f /etc/systemd/system/docker.service.d/99-operator-owned.conf
