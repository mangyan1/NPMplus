name: spellcheck
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: codespell-project/actions-codespell@v2.4.3
        with:
          check_filenames: true
          check_hidden: true
          # These animated SVGs embed raster frames as base64. Random binary
          # runs trip the dictionary, but there is no prose to spellcheck.
          skip: pnpm-lock.yaml,./frontend/translations,./frontend/public/images/crowdsec-logo-animated.svg,./docs/animated-logo.svg
          ignore_words_list: afterAll,alog,clen,hasTable,Nd
